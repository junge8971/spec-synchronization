schema: spec-driven

# Project context
context: |
  Baseline Control Center work covers UI, business logic, and agreed business APIs.
  integrate-mpmm-auth-permissions covers shared MPMM session, refresh, /me and permission-driven
  UI visibility. Read its proposal/design/specs for auth changes. Select mock versus real mode
  from dev/build configuration, not the current UI hostname: yarn dev defaults to local mocks;
  production builds and dev with mocks disabled use configured real APIs and session logic.
  T is the current backend deployment, not an auth activation condition. Validate credential
  destinations separately against configured API/auth addresses. Other auth models/APIs require
  separate agreement. Own OIDC login, global MPMM logout and a role editor are not approved.
  add-local-session-demo covers mock principal/profiles, simple fixed-response selection and
  confirmed user information in the header. Read its proposal/design/specs for mock changes.
  Keep the existing Express mocks without credentials or role enforcement; omit mocks from production.
  TanStack Devtools is cancelled. Permissions control UI visibility; backend authorizes requests.
  Keep session ownership, business validation, error handling, accessibility and the prohibition
  on E2E/browser tests without explicit user permission. Mock checks do not prove real integration.
  Removing existing auth dependencies within the agreed change is allowed. Auth-shaped fields
  belonging to business entities remain valid domain data.

# Per-artifact rules
rules:
  proposal:
    - Keep scope within agreed business APIs and the explicitly agreed exceptions described in context.
    - Do not propose new authentication, sessions, RBAC, permissions, auth redirects, or user-based UI restrictions without a separate agreement and spec change.
    - Preserve security, validation, error handling, accessibility, and the E2E/browser-test prohibition.
  design:
    - Design agreed business behavior and the explicitly agreed exceptions described in context.
    - Other auth/session/RBAC/permissions changes require separate agreement and a new spec change; removing existing auth dependencies is allowed.
    - Preserve security, validation, error handling, accessibility, and the E2E/browser-test prohibition.
  specs:
    - Specify agreed business behavior and the explicitly agreed exceptions described in context.
    - Do not require authentication, sessions, RBAC, permissions, auth redirects, or user-based UI restrictions before a separate agreement and spec change.
    - Preserve security, validation, error handling, accessibility, and the E2E/browser-test prohibition.
  tasks:
    - Keep tasks within agreed business APIs and the explicitly agreed exceptions described in context.
    - Do not add auth/session/RBAC/permissions work without a separate agreement and spec change; removing existing auth dependencies is allowed.
    - Keep security, validation, error handling, accessibility, and the E2E/browser-test prohibition intact.
